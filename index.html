<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Click here</title>
<style>
  html, body {
    height: 100%;
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f0f0f0;
    font-family: sans-serif;
  }
  a.btn {
    display: inline-block;
    padding: 40px 80px;
    font-size: 3rem;
    font-weight: bold;
    color: white;
    background: #e63946;
    border-radius: 20px;
    text-decoration: none;
    box-shadow: 0 8px 0 #a4222c;
  }
  a.btn:active {
    box-shadow: 0 2px 0 #a4222c;
    transform: translateY(6px);
  }
</style>
</head>
<body>
<a class="btn" href="https://www.youtube.com/watch?v=dQw4w9WgXcQ">Click Here</a>
</body>
</html>
